services:
  - type: web
    name: pg-hostel-management-system
    runtime: node
    plan: starter
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
    disk:
      name: hostel-sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
